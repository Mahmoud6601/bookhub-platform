# BookHub — base Compose file (production-safe defaults).
#
# REQUIRED SECRETS (fail fast — the stack refuses to start without them):
#   DB_PASSWORD, MYSQL_ROOT_PASSWORD, APP_KEY
# Provide them via a root .env file (copy .env.example) or exported
# environment variables. There are NO default passwords anywhere in this
# file — a missing secret is a startup error, not a silent weak default.
# See docs/DEPLOY.md and README.md for dev vs staging vs prod.
#
# Pinned image versions (verified on Docker Hub, 2026-11-24):
#   mysql:8.0.46, php:8.2.36-apache (api/Dockerfile), node:20.18.1-alpine
#   (client/Dockerfile), nginx:1.27.4-alpine, composer:2.8.4 (api/Dockerfile)
#
# Local development: `docker compose up` auto-loads docker-compose.override.yml,
# which adds host ports, code bind-mounts and debug mode. Production:
# `docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d`.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:8.0.46
    container_name: bookhub-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-bookapi}
      MYSQL_USER: ${DB_USERNAME:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required — copy .env.example to .env and set a strong password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required — copy .env.example to .env and set a strong password}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - app-network
    healthcheck:
      # $$ escapes the $ so Compose passes it literally to the container shell.
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: bookhub-api:${IMAGE_TAG:-dev}
    container_name: bookhub-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:?APP_KEY is required - generate one with php artisan key:generate --show}
      APP_URL: ${APP_URL:-http://localhost:8000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost,http://localhost:3000}
      SANCTUM_EXPIRATION: ${SANCTUM_EXPIRATION:-10080}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-bookapi}
      DB_USERNAME: ${DB_USERNAME:-app}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required — copy .env.example to .env and set a strong password}
    networks:
      - app-network
    # Storage persists uploads/cache across container recreations. The app
    # code itself is IN the image — there is intentionally NO ./api:/var/www
    # bind mount here (it used to hide vendor/ installed at build time).
    volumes:
      - api-storage:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: bookhub-client:${IMAGE_TAG:-dev}
    container_name: bookhub-client
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Server-side rendering hits the API directly on the private Docker network.
      NUXT_API_INTERNAL_BASE: http://api:8000
      # Browser-facing API base URL. Empty string uses same-origin /api via Nginx.
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-}
    networks:
      - app-network
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # wget is part of busybox in node:alpine (127.0.0.1 avoids IPv6 ::1 lookup).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  nginx:
    image: nginx:1.27.4-alpine
    container_name: bookhub-nginx
    restart: unless-stopped
    environment:
      # Rendered into the server_name by the nginx image's envsubst entrypoint.
      APP_URL_HOST: ${APP_URL_HOST:-localhost}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy
      client:
        condition: service_healthy
    networks:
      - app-network
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      # /healthz is answered in plain HTTP on port 80 (see the template).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

volumes:
  mysql-data:
    name: bookhub-mysql-data
  api-storage:
    name: bookhub-api-storage

networks:
  app-network:
    driver: bridge
    name: bookhub-app-network
