# BookHub Nginx — main config.
# Server blocks live in conf.d/*.conf (see default.conf.template, which is
# rendered by the nginx image's envsubst entrypoint using APP_URL_HOST).
# This file only sets global worker/event/http behaviour.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;
    client_max_body_size 10m;

    # Compression for text responses.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;

    include /etc/nginx/conf.d/*.conf;
}
